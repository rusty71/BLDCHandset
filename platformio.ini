; BLDCHandset - ELRS/CRSF headset
;
; Reads an absolute angle from an AS5048A magnetic encoder over SPI and
; injects it into the ELRS link as an RC channel, phase-locked to the
; radio's uplink so that the two never collide on the shared CRSF bus.
;
; Hardware : Waveshare RP2040 Zero (Raspberry Pi Pico), Arduino/mbed
; Build    : pio run
; Upload   : pio run -t upload
; Monitor  : pio device monitor
;
; Documentation: https://docs.platformio.org/page/projectconf.html

[env:waveshare_rp2040_zero]
platform = raspberrypi
board = pico
framework = arduino
build_flags =
	-DTARGET_RP2040
lib_deps =
	askuric/Simple FOC@^2.3.4
	simplefoc/SimpleFOCDrivers@^1.0.8

; Point these at your own board's stable by-id path to pin the port.
; Without them PlatformIO auto-detects the serial port on upload.
;upload_port = /dev/serial/by-id/usb-Arduino_RaspberryPi_Pico_XXXXXXXX-if00
;monitor_port = /dev/serial/by-id/usb-Arduino_RaspberryPi_Pico_XXXXXXXX-if00
